<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob: data: https://api.github.com">
  <title>TuffAudio</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="app">
    <header class="titlebar">
      <nav class="menu-bar">
        <button class="tb-btn" id="fileMenuBtn" title="File">File</button>
        <button class="tb-btn" data-action="save" data-icon="save" title="Save project (Ctrl+S)">Save</button>
        <button class="tb-btn" id="settingsBtn" data-icon="settings" title="Settings">Settings</button>
        <span class="tb-sep"></span>
        <button class="tb-btn" data-action="import" data-icon="import" title="Import audio (Ctrl+I)">Import</button>
        <button class="tb-btn accent" data-action="export" data-icon="export" title="Export audio (Ctrl+Shift+E)">Export</button>
      </nav>
      <div class="brand" title="TuffAudio">
        <img class="brand-logo" src="assets/logo.png" alt="TUFF" draggable="false">
        <span class="brand-ver" id="appVersion"></span>
      </div>
      <div class="titlebar-spacer"></div>
    </header>

    <div class="toolbar">
      <div class="group transport">
        <button class="icon-btn" data-action="home" data-icon="skipBack" title="Go to start (Home)"></button>
        <button class="icon-btn play" data-action="play" id="playBtn" title="Play / Pause (Space)"></button>
        <button class="icon-btn" data-action="stop" data-icon="stop" title="Stop"></button>
        <button class="icon-btn rec" data-action="record" id="recBtn" data-icon="record" title="Record (R)"></button>
        <button class="icon-btn" data-action="loop" id="loopBtn" data-icon="loop" title="Loop (L)"></button>
      </div>

      <div class="clock" title="Current position, and the selection length (or total length)">
        <div class="clock-main" id="clock">00:00.000</div>
        <div class="clock-sub" id="clockSub">00:00.000</div>
      </div>

      <div class="group source">
        <button class="source-btn" id="sourceBtn" title="Choose what to record">
          <span class="src-icon" id="srcIcon"></span>
          <span class="src-text"><small>Record from</small><span id="srcLabel">Microphone</span></span>
          <span data-icon="chevron"></span>
        </button>
      </div>

      <div class="group tools">
        <button class="tool" data-action="trim" data-icon="crop" title="Trim to selection (Ctrl+T)"><span>Trim</span></button>
        <button class="tool" data-action="delete" data-icon="trash" title="Delete selection (Del)"><span>Delete</span></button>
        <button class="tool" data-action="silence" data-icon="silence" title="Silence selection (Ctrl+L)"><span>Silence</span></button>
        <button class="tool" data-action="fadeIn" data-icon="fadeIn" title="Fade in"><span>Fade in</span></button>
        <button class="tool" data-action="fadeOut" data-icon="fadeOut" title="Fade out"><span>Fade out</span></button>
        <button class="tool" data-action="autoTrim" data-icon="wand" title="Auto-trim silence at both ends (Ctrl+Shift+T)"><span>Auto-trim</span></button>
        <button class="tool" data-action="duplicate" data-icon="split" title="Copy selection to a new track (Ctrl+D)"><span>To track</span></button>
      </div>

      <div class="group history">
        <button class="icon-btn" data-action="undo" data-icon="undo" title="Undo (Ctrl+Z)"></button>
        <button class="icon-btn" data-action="redo" data-icon="redo" title="Redo (Ctrl+Shift+Z)"></button>
      </div>

      <div class="group zoom">
        <button class="icon-btn" data-action="autoScroll" id="followBtn" data-icon="follow" title="Auto-scroll: follow the playhead (F)"></button>
        <button class="icon-btn" data-action="zoomOut" data-icon="zoomOut" title="Zoom out (-)"></button>
        <button class="icon-btn" data-action="zoomFit" data-icon="fit" title="Zoom to fit (Ctrl+0)"></button>
        <button class="icon-btn" data-action="zoomIn" data-icon="zoomIn" title="Zoom in (=)"></button>
      </div>
    </div>

    <main class="workspace">
      <section class="timeline" id="timeline">
        <div class="ruler-corner"></div>
        <canvas id="ruler" title="Click to move the cursor · drag to select"></canvas>
        <div class="tracks-scroll" id="tracksScroll">
          <div id="tracks"></div>
        </div>
        <div class="vscroll" id="vscroll"><div class="thumb"></div></div>
        <div class="playhead" id="playhead"></div>
      </section>
      <div class="splitter" id="inspSplit" title="Drag to resize · double-click to reset"></div>
      <aside class="inspector" id="inspector"></aside>
    </main>

    <footer class="statusbar">
      <div class="sb-item" id="sbInfo"></div>
      <div class="sb-spacer"></div>
      <div class="sb-item hint" id="sbHint">Ctrl+Scroll to zoom · Shift+Scroll for more tracks</div>
      <div class="master-meter" title="Output level">
        <span>OUT</span>
        <div class="meter-bars"><div class="mbar"><i></i><b></b></div><div class="mbar"><i></i><b></b></div></div>
      </div>
    </footer>
  </div>
  <div class="drop-overlay" id="dropOverlay"><div><span data-icon="import"></span>Drop to import</div></div>
</body>
</html>
